configs:
  - name: VOS_OIDC_USERINFO_URL
    type: string
    title: {zh-CN: VOS 身份校验地址, en: VOS userinfo URL}
    description: {zh-CN: 用于校验 OIDC 令牌的 VOS 后端地址。, en: VOS backend URL for OIDC token verification.}
    default: http://host.docker.internal:8105/v1000/oauth2/userinfo
  - name: VSUB_MAX_UPLOAD_BYTES
    type: integer
    title: {zh-CN: 单文件上传上限, en: Maximum upload size}
    description: {zh-CN: 单文件上传字节数上限。, en: Maximum number of bytes per uploaded file.}
    default: 4294967296
  - name: MODEL_HUB_SHARED_MODELS_PATH
    type: path
    title: {zh-CN: Model Hub 共享模型目录, en: Model Hub shared models directory}
    description: {zh-CN: V-Scheduler 管理模型的共享根目录；VOS 会自动推荐 V-Scheduler 安装时选择的公共目录，V-Sub 以只读方式加载权重。, en: Shared root directory managed by V-Scheduler. VOS automatically recommends the public directory chosen for V-Scheduler; V-Sub reads model weights without modifying them.}
    default: /data/vos_workspace/model_hub
    hints: [com.ictrek.model.storage]
