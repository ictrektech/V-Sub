configs:
  - name: V_ROUTER_URL
    type: string
    title: {zh-CN: 统一模型网关地址, en: Unified model gateway URL}
    description: {zh-CN: V-Scheduler 提供的 VOS 内统一模型网关；凭据通过账户授权取得。, en: Unified model gateway provided by V-Scheduler; credentials come from VOS account authorization.}
    default: http://v-scheduler:8080
  - name: VOS_OIDC_USERINFO_URL
    type: string
    title: {zh-CN: VOS 身份校验地址, en: VOS userinfo URL}
    description: {zh-CN: 用于校验 OIDC 令牌的 VOS 后端地址。, en: VOS backend URL for OIDC token verification.}
    default: http://host.docker.internal:8105/v1000/oauth2/userinfo
  - name: VSUB_MAX_UPLOAD_BYTES
    type: integer
    title: {zh-CN: 单文件上传上限, en: Maximum upload size}
    description: {zh-CN: 单文件上传字节数上限。, en: Maximum number of bytes per uploaded file.}
    default: 4294967296
  - name: MODEL_HUB_API_URL
    type: string
    title: {zh-CN: Model Hub 地址, en: Model Hub API URL}
    description: {zh-CN: 本地公共模型由 Model Hub 统一从 ModelScope 下载和管理。, en: Model Hub manages public model downloads from ModelScope.}
    default: http://v-scheduler:6005
  - name: MODEL_HUB_SHARED_MODELS_PATH
    type: path
    title: {zh-CN: Model Hub 共享模型目录, en: Model Hub shared models directory}
    description: {zh-CN: 必须与 Model Hub 的共享目录相同，V-Sub 以只读方式加载权重。, en: Must match the Model Hub shared directory; V-Sub reads model weights without modifying them.}
    default: /data/vos_workspace/model_hub
