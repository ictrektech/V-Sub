name: VOS Pull Package Release

on:
  push:
    tags:
      - "vos-v-sub-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: Fetch all release tags
        run: git fetch --force --tags origin

      - name: Write Feishu credentials
        run: |
          cat > "$HOME/.feishu.components.json" <<EOF
          {"feishu_app_id":"${{ secrets.FEISHU_APP_ID }}","feishu_app_secret":"${{ secrets.FEISHU_APP_SECRET }}"}
          EOF
          chmod 600 "$HOME/.feishu.components.json"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify VOS isolation and scripts
        run: |
          node --test vos/*.test.mjs
          node --check vos/gateway.mjs
          bash -n docker/build_image.sh ictrek.app/scripts/package.sh ictrek.app/scripts/update_version.sh
          python3 -m py_compile ictrek.app/scripts/package.py scripts/feishu_release.py

      - name: Install dependency resolver
        run: |
          python3 -m pip install 'PyYAML==6.0.3'
          python3 -m unittest discover -s ictrek.app/scripts -p 'test_dependencies.py'

      - name: Build pull-mode package
        env:
          APPSTORE_IP: ${{ secrets.APPSTORE_IP }}
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#vos-v-sub-v}"
          test "$(cat ictrek.app/VERSION)" = "$VERSION"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -H -p 32222 "$APPSTORE_IP" >> "$HOME/.ssh/known_hosts"

          askpass="$RUNNER_TEMP/vos-appstore-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          printf '%s\n' "$APPSTORE_TOKEN"
          EOF
          chmod 700 "$askpass"
          export SSH_ASKPASS="$askpass"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=:0

          control_socket="$RUNNER_TEMP/vos-appstore-ssh.sock"
          trap 'ssh -S "$control_socket" -O exit -p 32222 tunneluser@"$APPSTORE_IP" >/dev/null 2>&1 || true' EXIT

          ssh \
            -M \
            -S "$control_socket" \
            -f \
            -N \
            -L 18899:127.0.0.1:18090 \
            -p 32222 \
            -o BatchMode=no \
            -o ExitOnForwardFailure=yes \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            tunneluser@"$APPSTORE_IP" </dev/null

          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:18899/api/health" >/dev/null; then
              ready=true
              break
            fi
            if ! ssh -S "$control_socket" -O check -p 32222 tunneluser@"$APPSTORE_IP" >/dev/null 2>&1; then
              echo "VOS App Store SSH tunnel exited before becoming ready." >&2
              exit 1
            fi
            sleep 1
          done
          [[ "$ready" == true ]] || { echo "VOS App Store SSH tunnel did not become ready." >&2; exit 1; }

          export VOS_DEPENDENCY_CATALOG_URL="http://127.0.0.1:18899"
          PACKAGE_VERSION="$VERSION" ./ictrek.app/scripts/package.sh
          test -f "ictrek.app/dist/v_sub_${VERSION}_pull.tar"

      - name: Create release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_PREFIX: vos-v-sub-v
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#vos-v-sub-v}"
          CURRENT="${GITHUB_REF_NAME}"
          PUBLIC_TAG="v${VERSION}"
          export PUBLIC_TAG
          PREVIOUS="$(gh release list --limit 100 --json tagName,publishedAt --jq '[.[] | select(.tagName != env.PUBLIC_TAG) | select((.tagName | startswith("v")) or (.tagName | startswith(env.TAG_PREFIX)))] | sort_by(.publishedAt) | reverse | .[0].tagName // ""')"
          {
            echo "Pull-mode VOS app package for com.ictrek.v-sub."
            echo
            if [[ -n "$PREVIOUS" ]]; then
              echo "Changes since ${PREVIOUS}:"
              git log --no-merges --pretty='- %s (%h)' "${PREVIOUS}..${CURRENT}"
            else
              echo "Initial VOS package release."
              git log --no-merges --pretty='- %s (%h)' -20 "${CURRENT}"
            fi
          } > release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#vos-v-sub-v}"
          PUBLIC_TAG="v${VERSION}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${PUBLIC_TAG}" >/dev/null 2>&1; then
            git tag "$PUBLIC_TAG" "$GITHUB_SHA"
            git push origin "$PUBLIC_TAG"
          fi
          gh release create "$PUBLIC_TAG" "ictrek.app/dist/v_sub_${VERSION}_pull.tar" \
            --verify-tag --latest --title "v${VERSION}" --notes-file release-notes.md

      - name: Publish package to VOS App Store
        env:
          APPSTORE_IP: ${{ secrets.APPSTORE_IP }}
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#vos-v-sub-v}"
          PACKAGE="ictrek.app/dist/v_sub_${VERSION}_pull.tar"
          test -n "${APPSTORE_IP:-}"
          test -n "${APPSTORE_TOKEN:-}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -H -p 32222 "$APPSTORE_IP" >> "$HOME/.ssh/known_hosts"
          askpass="$RUNNER_TEMP/vos-appstore-askpass.sh"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          printf '%s\n' "$APPSTORE_TOKEN"
          EOF
          chmod 700 "$askpass"
          export SSH_ASKPASS="$askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          socket="$RUNNER_TEMP/vos-appstore-ssh.sock"
          trap 'ssh -S "$socket" -O exit -p 32222 tunneluser@"$APPSTORE_IP" >/dev/null 2>&1 || true' EXIT
          ssh -M -S "$socket" -f -N -L 18899:127.0.0.1:18090 -p 32222 \
            -o BatchMode=no -o ExitOnForwardFailure=yes -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no tunneluser@"$APPSTORE_IP" </dev/null
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18899/api/health >/dev/null && break
            sleep 1
          done
          response="$(curl -kfsS -F "package=@${PACKAGE}" -F "force=true" -F "channel=stable" "http://127.0.0.1:18899/api/appstore/apps")" \
            || response="$(curl -kfsS -F "package=@${PACKAGE}" -F "force=true" "http://127.0.0.1:18899/api/appstore/apps")"
          RESPONSE="$response" python3 - <<'PY'
          import json, os
          value = json.loads(os.environ["RESPONSE"])
          if value.get("code") != 0:
              raise SystemExit(value)
          print(value.get("data"))
          PY
